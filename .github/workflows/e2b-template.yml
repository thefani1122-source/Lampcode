name: Build E2B Template
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2B CLI
        run: npm install -g @e2b/cli@latest

      - name: Build E2B Template
        run: e2b template build
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
