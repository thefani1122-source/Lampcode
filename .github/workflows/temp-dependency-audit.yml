name: Temporary dependency audit remediation
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      - name: Generate lockfile from the reviewed manifest
        run: npm install --package-lock-only

      - name: Apply remaining semver-compatible audit fixes
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --json > audit-fix-report.json
          fix_code=$?
          echo "AUDIT_FIX_EXIT=$fix_code"
          set -e

      - name: Commit the regenerated lockfile to the isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock changes to commit"
          else
            git commit -m "chore(security): update patched dependency lockfile [skip ci]"
            git fetch origin chore/dependency-audit-fix-20261031
            git rebase origin/chore/dependency-audit-fix-20261031
            git push origin HEAD:chore/dependency-audit-fix-20261031
          fi

      - name: Reinstall the updated lockfile
        run: npm ci

      - name: Verify source and package compatibility
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Capture final production audit
        shell: bash
        run: |
          mkdir -p dependency-audit-artifact
          cp package.json package-lock.json dependency-audit-artifact/
          cp audit-fix-report.json dependency-audit-artifact/
          npm audit --omit=dev --json > dependency-audit-artifact/audit-report-after.json || true
          npm ls --all --json > dependency-audit-artifact/npm-tree.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: lampcode-dependency-audit-remediation
          path: dependency-audit-artifact/
          if-no-files-found: error
          retention-days: 3
